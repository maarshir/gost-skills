<svg xmlns="http://www.w3.org/2000/svg" width="750" height="551" viewBox="0 0 750 551">
<rect width="750" height="551" rx="10" fill="#0f1419"/>
<rect width="750" height="32" rx="10" fill="#1c2128"/><rect y="22" width="750" height="10" fill="#1c2128"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="375.0" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="12" fill="#8b949e">gost-skills</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" xml:space="preserve" style="white-space:pre">
<text x="24" y="58.7" xml:space="preserve"><tspan fill="#7ee787">$</tspan><tspan fill="#e6edf3"> python skills/gost-report/scripts/check_docx.py example.docx</tspan></text>
<text x="24" y="79.7" fill="#d6dde5" xml:space="preserve"></text>
<text x="24" y="100.7" fill="#79c0ff" xml:space="preserve">Проверка: example.docx, профиль «ГОСТ 7.32-2017»</text>
<text x="24" y="121.7" fill="#ff7b72" xml:space="preserve">Ошибок: 9, замечаний: 0</text>
<text x="24" y="142.7" fill="#d6dde5" xml:space="preserve"></text>
<text x="24" y="163.7" fill="#ff7b72" xml:space="preserve">ОШИБКИ</text>
<text x="24" y="184.7" fill="#ffa657" xml:space="preserve">1. Поле левое 20 мм, нужно 30 мм (п. 6.1.1)</text>
<text x="24" y="205.7" fill="#ffa657" xml:space="preserve">2. Заголовок структурного элемента не по центру (п. 6.2.1)</text>
<text x="24" y="226.7" fill="#8b949e" xml:space="preserve">   абзац 18 «ЗАКЛЮЧЕНИЕ»</text>
<text x="24" y="247.7" fill="#ffa657" xml:space="preserve">3. Структурный элемент или раздел не с новой страницы (п. 6.2.1)</text>
<text x="24" y="268.7" fill="#8b949e" xml:space="preserve">   абзац 18 «ЗАКЛЮЧЕНИЕ»</text>
<text x="24" y="289.7" fill="#ffa657" xml:space="preserve">4. Точка после номера «1.1.» (п. 6.4.1)</text>
<text x="24" y="310.7" fill="#8b949e" xml:space="preserve">   абзац 14 «1.1. Сравнение»</text>
<text x="24" y="331.7" fill="#ffa657" xml:space="preserve">5. Шрифт Arial вместо Times New Roman (п. 6.1.1)</text>
<text x="24" y="352.7" fill="#8b949e" xml:space="preserve">   абзац 17 «Метод А оказался точнее на выбранном на…» (раздел «1.1. Сравнение»)</text>
<text x="24" y="373.7" fill="#ffa657" xml:space="preserve">6. Слово «Рисунок» в подписи пишется полностью (п. 6.5.7)</text>
<text x="24" y="394.7" fill="#8b949e" xml:space="preserve">   абзац 13 «Рис. 1 - Схема поиска.» (раздел «1 Обзор методов»)</text>
<text x="24" y="415.7" fill="#ffa657" xml:space="preserve">7. В подписи дефис вместо тире: «– Название» (п. 6.5.7)</text>
<text x="24" y="436.7" fill="#8b949e" xml:space="preserve">   абзац 13 «Рис. 1 - Схема поиска.» (раздел «1 Обзор методов»)</text>
<text x="24" y="457.7" fill="#ffa657" xml:space="preserve">8. Точка в конце подписи (п. 6.5.7)</text>
<text x="24" y="478.7" fill="#8b949e" xml:space="preserve">   абзац 13 «Рис. 1 - Схема поиска.» (раздел «1 Обзор методов»)</text>
<text x="24" y="499.7" fill="#ffa657" xml:space="preserve">9. Ссылка [3], а в списке источников их 2 (п. 6.16)</text>
<text x="24" y="520.7" fill="#8b949e" xml:space="preserve">   абзац 19 «Сравнение показало, что метод А подходи…» (раздел «ЗАКЛЮЧЕНИЕ»)</text>
</g></svg>
