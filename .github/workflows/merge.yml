name: Тесты и слияние

# Запускается, когда пушится ветка feature/... или fix/...
# Если проверки прошли, ветка сжимается в один коммит в main и удаляется.
# Если нет, ветка остаётся как есть.
on:
  push:
    branches: ['feature/**', 'fix/**']

permissions:
  contents: write

# Не даём двум слияниям идти одновременно
concurrency:
  group: branch-merge
  cancel-in-progress: false

jobs:
  test-and-merge:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверки
        run: |
          set -e
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -n "$(git ls-files '*.py')" ]; then python -m compileall -q $(git ls-files '*.py'); fi
          if [ -d tests ]; then pip install pytest; python -m pytest -q; fi
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      - name: Сжать в main и удалить ветку
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          SRC="origin/${BRANCH}"
          git config user.name "$(git log -1 --format=%an "$SRC")"
          git config user.email "$(git log -1 --format=%ae "$SRC")"
          git checkout main
          TITLE="$(git log -1 --format=%s "$SRC")"
          COUNT="$(git rev-list --count "main..$SRC")"
          git merge --squash "$SRC"
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен"
          else
            if [ "$COUNT" -gt 1 ]; then
              BODY="$(git log --reverse --format='- %s' "main..$SRC")"
              git commit -m "$TITLE" -m "$BODY"
            else
              git commit -m "$TITLE"
            fi
            git push origin main
          fi
          git push origin --delete "$BRANCH"
