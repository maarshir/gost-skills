# Пример настроек под методичку вуза. Здесь только то, что отличается от ГОСТ 7.32;
# остальное берётся из gost-7.32.toml. Запуск:
#   python scripts/check_docx.py работа.docx --config assets/methodichka-example.toml

name = "ГОСТ 7.32-2017 + пример методички"

[text]
size_pt = 14             # строго 14 пт, а не «не меньше 12»
alignment = "justify"    # основной текст по ширине

# Если методичка называет элементы по-своему, перечислите их целиком:
# [headings]
# structural = ["СОДЕРЖАНИЕ", "ВВЕДЕНИЕ", "ЗАКЛЮЧЕНИЕ", "СПИСОК ЛИТЕРАТУРЫ"]
# required = ["СОДЕРЖАНИЕ", "ВВЕДЕНИЕ", "ЗАКЛЮЧЕНИЕ", "СПИСОК ЛИТЕРАТУРЫ"]

# Поля у некоторых вузов другие, например правое 10 мм:
# [page]
# margin_right_mm = 10
