# Профиль проверки по ГОСТ 7.32-2017 (раздел 6 «Правила оформления»).
# Своя методичка: скопируйте assets/methodichka-example.toml, поменяйте нужные
# значения и передайте файл через --config. Всё, что там не указано, берётся отсюда.

name = "ГОСТ 7.32-2017"

[page]
# 6.1.1: формат А4, поля левое 30 мм, правое 15 мм, верхнее и нижнее 20 мм
width_mm = 210
height_mm = 297
margin_left_mm = 30
margin_right_mm = 15
margin_top_mm = 20
margin_bottom_mm = 20
tolerance_mm = 1

[text]
# 6.1.1: шрифт не меньше 12 пт, рекомендуется Times New Roman, цвет чёрный,
# полуторный интервал, абзацный отступ 1,25 см
font = "Times New Roman"
size_min_pt = 12
size_pt = 0            # 0 значит «любой не меньше size_min_pt»; многие методички требуют 14
line_spacing = 1.5
indent_cm = 1.25
indent_tolerance_cm = 0.05
# Выравнивание основного текста ГОСТ 7.32 не задаёт. Методички почти всегда
# требуют по ширине: тогда alignment = "justify". Пустая строка значит «не проверять».
alignment = ""
black_only = true

[headings]
# 6.2.1: заголовки структурных элементов прописными, по центру, без точки,
# каждый с новой страницы. 6.2.3 и 6.4: разделы с абзацного отступа,
# номер арабскими цифрами без точки, полужирный, без точки в конце.
structural = [
  "СПИСОК ИСПОЛНИТЕЛЕЙ",
  "РЕФЕРАТ",
  "СОДЕРЖАНИЕ",
  "ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ",
  "ПЕРЕЧЕНЬ СОКРАЩЕНИЙ И ОБОЗНАЧЕНИЙ",
  "ВВЕДЕНИЕ",
  "ЗАКЛЮЧЕНИЕ",
  "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ",
]
# Какие структурные элементы обязательны в этой работе.
# Для отчёта о НИР ГОСТ требует больше (реферат, список исполнителей),
# для курсовой обычно хватает этих.
required = ["СОДЕРЖАНИЕ", "ВВЕДЕНИЕ", "ЗАКЛЮЧЕНИЕ", "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ"]
new_page = true
bold = true

[captions]
# 6.5: «Рисунок 1 – Название» под рисунком по центру, без точки в конце.
# 6.6: «Таблица 1 – Название» над таблицей слева без абзацного отступа.
dashes = ["–", "—"]

[references]
# 6.5.1, 6.6.x: на каждый рисунок и таблицу должна быть ссылка в тексте.
# 6.16: источники нумеруются в порядке появления ссылок в тексте.
figures_and_tables = true
sources = true

[page_numbers]
# 6.3: номер в центре нижней части страницы, на титульном листе не ставится
check = true
