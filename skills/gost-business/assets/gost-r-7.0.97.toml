# Профиль проверки деловых документов по ГОСТ Р 7.0.97-2016.
# Своя инструкция по делопроизводству: скопируйте assets/instruction-example.toml,
# поменяйте нужные значения и передайте файл через --config. Остальное берётся отсюда.

name = "ГОСТ Р 7.0.97-2016"

[page]
# Раздел 4: лист А4, для коротких документов А5; поля не меньше
# левое 20 мм, правое 10 мм, верхнее и нижнее 20 мм
rule = "раздел 4"
sizes_mm = [[210, 297], [148, 210]]
margin_left_mm = 20
margin_right_mm = 10
margin_top_mm = 20
margin_bottom_mm = 20
tolerance_mm = 1

[text]
# Раздел 4: Times New Roman, Arial, Calibri или Verdana, 12–14 пт; абзацный отступ 1,25 см.
# В таблицах и в отметке об исполнителе допускается мельче, их размер не проверяется.
rule = "раздел 4"
fonts = ["Times New Roman", "Arial", "Calibri", "Verdana"]
size_min_pt = 12
size_max_pt = 14
indent_cm = 1.25
indent_tolerance_cm = 0.05
# Отступ проверяется у абзацев текста не короче стольких знаков:
# реквизиты (адресат, дата, подпись) короткие и печатаются без отступа.
body_min_chars = 100

[date]
# 5.11: цифрами в порядке день, месяц, год (05.03.2026) или словесно-цифровым способом
# (5 марта 2026 г.). words_allowed = false оставляет только цифровой.
rule = "5.11"
words_allowed = true
