# Профиль по умолчанию: ГОСТ Р 7.0.100-2018 без требований конкретного вуза.
# Свой файл настроек содержит только отличия и накладывается поверх этого.

name = "ГОСТ Р 7.0.100-2018"

[areas]
# Между областями описания «. – » (п. 4.6.2). Точкой заменяют только при выделении
# областей шрифтом или новой строкой (п. 4.6.4), поэтому по умолчанию это замечание.
# "dash": ждать «. – »; "dot": методичка разрешает точку; "any": не проверять.
separator = "dash"

[content_type]
# Область «вид содержания и средство доступа»: «– Текст : непосредственный.»
# Многие методички её требуют, ГОСТ оставляет на усмотрение. true: ошибка, если нет.
required = false

[place]
# Сокращения М. и СПб. стандарт допускает. false: требовать «Москва», «Санкт-Петербург».
allow_abbreviations = true

[order]
# "any": не проверять; "alphabet": по алфавиту, сначала кириллица, потом латиница.
mode = "any"
# Нормативные акты и стандарты в начале списка (так требуют некоторые методички).
legal_first = false

[freshness]
# Сколько лет источнику допустимо. 0: не проверять. Законы и стандарты не считаются.
max_age_years = 0
